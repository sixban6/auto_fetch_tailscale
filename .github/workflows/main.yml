name: Daily Fetch Tailscale to Release

on:
  schedule:
    # 每天 UTC 凌晨 2 点自动运行
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本号 (留空则抓取官方最新稳定版，无需加 v)'
        required: false
        default: ''

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 获取官方绝对最新版本号、下载 amd64 并拉取对应版本源码
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL "https://pkgs.tailscale.com/stable/?mode=json" | jq -r .Version)
          fi

          # 防呆处理：如果手动输入了带 v 的版本号 (如 v1.104.7)，自动剔除 v
          VERSION="${VERSION#v}"

          echo "TAILSCALE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "🎯 成功获取官方最新版本: $VERSION"

          # amd64 保持官方原版资产（含 .tgz 与 .deb）
          wget -nv -O tailscale_${VERSION}_amd64.tgz https://pkgs.tailscale.com/stable/tailscale_${VERSION}_amd64.tgz
          wget -nv -O tailscale_${VERSION}_amd64_ubuntu.deb https://pkgs.tailscale.com/stable/ubuntu/pool/tailscale_${VERSION}_amd64.deb
          wget -nv -O tailscale_${VERSION}_amd64_debian.deb https://pkgs.tailscale.com/stable/debian/pool/tailscale_${VERSION}_amd64.deb

          # 拉取同版本号官方源码用于编译 ARM64 路由器精简合体版
          git clone --depth 1 --branch "v${VERSION}" https://github.com/tailscale/tailscale.git tailscale-src

      - name: Setup Go (匹配 Tailscale 源码 go.mod 版本)
        uses: actions/setup-go@v5
        with:
          go-version-file: tailscale-src/go.mod

      - name: 编译 ARM64 精简合体无加壳版 (ts_include_cli + 路由最小特性集)
        run: |
          set -euo pipefail
          VERSION="${{ env.TAILSCALE_VERSION }}"
          ARCH="arm64"
          DIR_NAME="tailscale_${VERSION}_${ARCH}"
          TGZ_NAME="${DIR_NAME}.tgz"

          cd tailscale-src
          eval $(CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go run ./cmd/mkversion)
          TAGS=$(CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go run ./cmd/featuretags --min --add=cli,osrouter,iptables,advertiseroutes,advertiseexitnode,useroutes,useexitnode,nattraversal,portmapper,listenrawdisco,ipnbus,debug,bakedroots,cachenetmap,dns,health,routecheck,useproxy,unixsocketidentity)
          echo "Build version: ${VERSION_LONG}"
          echo "Build tags: ${TAGS}"

          mkdir -p "../${DIR_NAME}"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -tags="${TAGS}" \
            -trimpath \
            -ldflags="-s -w -X tailscale.com/version.longStamp=${VERSION_LONG} -X tailscale.com/version.shortStamp=${VERSION_SHORT}" \
            -o "../${DIR_NAME}/tailscaled" \
            ./cmd/tailscaled
          cd ..

          # 合体单二进制：通过软链接以 tailscale CLI 入口复用同一个可执行文件，节省 ~50% Flash 与运行时内存
          ln -s tailscaled "${DIR_NAME}/tailscale"
          ls -lh "${DIR_NAME}/"
          file "${DIR_NAME}/tailscaled"

          GZIP=-9 tar -czf "${TGZ_NAME}" "${DIR_NAME}"
          rm -rf "${DIR_NAME}" tailscale-src

          sha256sum *.tgz > checksums.txt
          sha256sum *.deb >> checksums.txt
          cat checksums.txt

      - name: 清理旧的 Release 页面
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y -R ${{ github.repository }} || true

      - name: 发布全新 Release 并上传文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Tailscale 最新全平台离线包"
          body: |
            ### 🤖 自动同步与精简构建完成
            - **官方稳定版本**: `${{ env.TAILSCALE_VERSION }}`

            ### 📦 文件说明：
            - `*_arm64.tgz`: **OpenWrt/ARM64 路由器专用精简合体版（未 UPX 加壳）** —— 基于官方同版本源码通过 `featuretags --min` 裁剪桌面/Taildrop/SSH/Funnel 等桌面冗余组件并合并 `cli + daemon`（`tailscale -> tailscaled` 软链接），兼顾小 Flash 存储与低匿名内存驻留，适配 256MB 小内存路由器。
            - `*_amd64.tgz`: 官方原版，未修改。
            - `*.deb`: 适用于 Debian/Ubuntu 的官方原版离线安装包。
          files: |
            checksums.txt
            *.tgz
            *.deb
